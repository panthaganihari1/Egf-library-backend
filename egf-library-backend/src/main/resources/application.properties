spring.application.name=EGF Book Library
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
spring.jpa.defer-datasource-initialization=true
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=0
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=EGFLibrarySecretKey2024SuperSecureKeyForJWTTokenGeneration
jwt.expiration=86400000

# CORS - Allow both local and deployed frontend
cors.allowed-origins=http://localhost:3000,https://ammerpet-egf-book-library.vercel.app